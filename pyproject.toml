[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ghome-foyer-api"
description = "Generated protobuf stubs for Google Home Foyer API"
authors = [{ name = "Ruslan Sayfutdinov", email = "ruslan@sayfutdinov.com" }]
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Typing :: Typed",
]
keywords = ["Google Home", "Foyer API"]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "grpcio>=1.83.1,<2",
    "protobuf>=7.35.1",
]

[dependency-groups]
dev = [
    "dprint-py>=0.63.0.0",
    # Generated code requires grpcio and protobuf at least as new as grpcio-tools and its protoc.
    # Keep it at Home Assistant's pinned grpcio so the stubs load there.
    "grpcio-tools==1.83.1",
    "mypy-protobuf>=5.1.0",
    "mypy>=2.4.0",
    "ruff>=0.17.1",
    "types-grpcio>=1.84.0.20260928",
]

[project.urls]
"Homepage" = "https://github.com/KapJI/ghome-foyer-api"
"Bug Tracker" = "https://github.com/KapJI/ghome-foyer-api/issues"
"Release Notes" = "https://github.com/KapJI/ghome-foyer-api/releases"

[tool.hatch.build]
packages = ["ghome_foyer_api"]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
required-version = ">=0.11.0"
target-version = "py312"

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.mypy]
python_version = "3.12"
show_error_codes = true
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_no_return = true
warn_unreachable = true
