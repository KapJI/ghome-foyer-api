version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    # Never raise floors in pyproject.toml: users need runtime floors no newer
    # than Home Assistant's pins, and grpcio-tools stays at HA's grpcio.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    # A release has a week to be yanked before it is proposed here.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
  - package-ecosystem: github-actions
    directories:
      # Workflows in .github/workflows
      - "/"
      # Composite actions are not covered by "/" and must be listed explicitly
      - "/.github/actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
