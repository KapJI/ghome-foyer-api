name: "Common steps to install and cache dependencies"
description: "Install uv, Python and the project dependencies"

inputs:
  python-version:
    description: "Python version to set up"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}
        # Different jobs on the same Python version still compute the
        # same key and race to save it, so add the job name too.
        cache-suffix: ${{ github.job }}

    - name: Install dependencies with uv
      shell: bash
      run: uv sync
